<!DOCTYPE html>
<html>

<head>
    <title>Survey Form</title>
</head>

<body>

    <center>

        <h1>Survey Form</h1>

        <p>Let us know how we can improve freeCodeCamp</p>

        <form>

            <table>

                <tr>
                    <td>Name:</td>
                    <td>
                        <input type="text" placeholder="Enter your Name">
                    </td>
                </tr>

                <tr>
                    <td>Email:</td>
                    <td>
                        <input type="email" placeholder="Enter your Email">
                    </td>
                </tr>

                <tr>
                    <td>Age:</td>
                    <td>
                        <input type="number" placeholder="Age">
                    </td>
                </tr>

                <tr>
                    <td>Current Role:</td>
                    <td>
                        <select>
                            <option>Student</option>
                            <option>Developer</option>
                            <option>Teacher</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>
                        Recommend freeCodeCamp?
                    </td>

                    <td>
                        <input type="radio" name="recommend">
                        Definitely
                        <br>

                        <input type="radio" name="recommend">
                        Maybe
                        <br>

                        <input type="radio" name="recommend">
                        Not Sure
                    </td>
                </tr>

                <tr>
                    <td>What do you like most?</td>

                    <td>
                        <select>
                            <option>Select an option</option>
                            <option>Challenges</option>
                            <option>Projects</option>
                            <option>Community</option>
                        </select>
                    </td>
                </tr>

                <tr>

                    <td>
                        Things to improve
                    </td>

                    <td>

                        <input type="checkbox">
                        Front-end Projects
                        <br>

                        <input type="checkbox">
                        Back-end Projects
                        <br>

                        <input type="checkbox">
                        Data Visualization

                    </td>

                </tr>

                <tr>

                    <td>Comments:</td>

                    <td>
                        <textarea rows="5" cols="25"></textarea>
                    </td>

                </tr>

                <tr>

                    <td colspan="2">

                        <button type="submit">
                            Submit
                        </button>

                    </td>

                </tr>

            </table>

        </form>

    </center>

</body>

</html>
